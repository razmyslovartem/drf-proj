[tool.poetry]
name = "drf-proj"
version = "0.1.0"
description = ""
authors = ["Artem Razmyslov <89083284426@mail.ru>"]
readme = "README.md"
package-mode = false
# equires-python = ">=3.13,<4.0"

[tool.poetry.dependencies]
python = "^3.13"
django = ">=5.1,<5.2"
djangorestframework = "^3.17.1"
python-dotenv = "^1.2.2"
psycopg2-binary = "^2.9.12"
djangorestframework-stubs = "^3.17.1"
pillow = "^12.3.0"
django-filter = ">=25.0,<26.0"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.15.3"
spectacular = "^0.4.0"
drf-spectacular = "^0.30.0"
stripe = "^15.4.0"
celery = {extras = ["redis"], version = "^5.6.3"}
django-celery-results = "^2.6.0"
django-celery-beat = "^2.9.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ipython (>=9.14.1,<10.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "coverage (>=7.15.2,<8.0.0)",
    "pytest (>=8.0,<9.0)",
    "pytest-django (>=4.0,<5.0)",
    "pytest-cov (>=4.0,<5.0)",
]

[tool.black]
line-length = 119
target-version = ['py313']
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.github
  | deploy
  | migrations
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
force_single_line = true
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
line_length = 119
skip = [".git", ".venv", "venv", "__pycache__"]
skip_glob = [
    "**/migrations/**",
    "docs/*",
    "*.txt",
    ".git",
    ".github",
    ".venv",
    ".deploy",
    ".mypy_cache",
    ".pytest_cache"
]
combine_as_imports = true
known_first_party = ['config', 'app_users', 'app_materials']
src_paths = ['.']

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_ci"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=.",
    "--cov-report=xml",
    "--cov-report=html",
]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
ignore_missing_imports = true
disallow_incomplete_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
warn_return_any = false
warn_unreachable = true
no_implicit_optional = false
strict_optional = false
exclude = [".git", ".venv", "venv", "__pycache__"]
exclude_gitignore = true
